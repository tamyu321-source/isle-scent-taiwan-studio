name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Fieldwork adapters and exports
        run: |
          python -X utf8 -m unittest discover -s tools/fieldwork -p 'test_*.py' -v
          node --test tests/fieldwork.test.mjs
      - name: Refresh public merchant records
        run: >-
          python -X utf8 tools/fieldwork/fieldwork.py
          --output-dir public/data/fieldwork
          --seed public/data/fieldwork/merchants.json
          --snapshot-url https://tamyu321-source.github.io/isle-scent-taiwan-studio/data/fieldwork/merchants.json
          --max-pages 100
      - name: Report collection status
        run: node scripts/fieldwork-summary.mjs
      - name: Package Python download
        run: node scripts/package-fieldwork.mjs
      - name: Build static site
        run: npm run build
      - name: Prepare clean URLs
        run: node scripts/prepare-github-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
